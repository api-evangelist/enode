      description: Target maximum current for entity
    ActionFailureReason:
      type: object
      properties:
        type:
          type: string
          enum:
          - NO_RESPONSE
          - FAILED_PRECONDITION
          - CONFLICT
          - NOT_FOUND
          - UNNECESSARY
          - REQUESTED_CANCELLATION
          description: "A machine-readable high level error category.\n\n * `NO_RESPONSE`: The device did not react to our commands within the action's timeout window.  \n * `FAILED_PRECONDITION`: The device did not meet all required preconditions for this action to be executed during the action's timeout window. \n * `UNNECESSARY`: The action was not carried out given that the device was already in the desired state. \n * `CONFLICT`: A newer action for this device, or for a device paired with it, has replaced this action. This action is now abandoned.  \n * `REQUESTED_CANCELLATION`: This action was cancelled by request of the controlling owner. The controlling owner may refer to another Enode entity which initiated the command, such as a schedule or smart override. \n * `NOT_FOUND`: The device was deleted while the action was `PENDING`.\n"
        detail:
          type: string
          description: A human-readable explanation of why the action was unsuccessful.
          example: The device remained unreachable.
      required:
      - type
      - detail
      description: Information about why was this action not executed successfully.
    ChargerChargeState:
      type: object
      properties:
        isPluggedIn:
          type:
          - boolean
          - 'null'
          description: Indicates whether the charger has a vehicle plugged into it (regardless of whether that vehicle is actually charging)
        isCharging:
          type:
          - boolean
          - 'null'
          description: Indicates whether the charger is currently delivering power to the vehicle and actively charging its battery.
        chargeRate:
          type:
          - number
          - 'null'
          description: 'The current charge rate in kW.


            This property is only available when the charger is actively charging a vehicle, and is `null` any other time.'
        lastUpdated:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of latest charge state update
          example: '2020-04-07T17:04:26Z'
        maxCurrent:
          type:
          - number
          - 'null'
          deprecated: true
          description: 'Deprecated: Use `chargeRateLimit` instead.


            Desired max current in amperes, if set'
        powerDeliveryState:
          $ref: '#/components/schemas/ChargerPowerDeliveryState'
        pluggedInVehicleId:
          type:
          - string
          - 'null'
          description: "ID of the vehicle currently plugged into the charger. By default, this attribute will be `null` and will only be populated if:\n * The charger and the vehicle are linked to the same Enode `userId`.\n * AND Enode has determined that the vehicle and charger are **currently** plugged into each other."
          example: bf077f15-a7aa-4bc4-b917-8f1c89676198
        chargeRateLimit:
          type:
          - number
          - 'null'
          description: "The current charge rate limit in kW. Returns null when unavailable from the vendor. \n\nBeta: This property is available in beta as part of [Set Charge Rate Limit](/api#postSetChargerChargeRateLimit)."
      required:
      - isPluggedIn
      - isCharging
      - chargeRate
      - lastUpdated
      - maxCurrent
      - powerDeliveryState
      description: Latest information about the charger. `null` values indicate we are unable to determine a value for the field based on the information coming from the vendor.
    ChargingAction:
      type: string
      enum:
      - START
      - STOP
