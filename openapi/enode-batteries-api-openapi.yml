openapi: 3.2.0
info:
  title: Enode Batteries API
  version: '2023-08-01'
  description: One integration, 1000+ energy devices.
  license:
    name: Enode Commercial License
    url: https://enode.com
servers:
- url: https://enode-api.production.enode.io
tags:
- name: Batteries
  description: The `Battery` object represents a residential energy storage unit, like a Tesla Powerwall or Enphase IQ. It offers detailed insights into the battery's operation and allows you to instruct the battery on handling its stored energy.
paths:
  /batteries:
    get:
      summary: List Batteries
      operationId: listBatteries
      description: Returns a paginated list of all Batteries.
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/PaginationQueryAfter'
      - $ref: '#/components/parameters/PaginationQueryBefore'
      - $ref: '#/components/parameters/PaginationQueryPageSize'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatteryList'
  /users/{userId}/batteries:
    get:
      summary: List User Batteries
      description: Returns a paginated list of batteries for the given userId.
      operationId: listUserBatteries
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/UserPathId'
      - $ref: '#/components/parameters/PaginationQueryAfter'
      - $ref: '#/components/parameters/PaginationQueryBefore'
      - $ref: '#/components/parameters/PaginationQueryPageSize'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatteryList'
  /batteries/{batteryId}:
    get:
      summary: Get Battery
      operationId: getBattery
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/PathBatteryId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battery'
  /batteries/{batteryId}/operation-mode:
    post:
      summary: Set Operation Mode for Battery
      operationId: postUserSetOperationMode
      description: 'Set the operation mode of a battery: whether it optimizes on its own, charges, discharges, or holds its current charge level. Use this to steer your user''s stored energy in line with optimization goals and grid signals; the `operationMode` field below describes each mode.


        The change is asynchronous: the request returns an Action that retries until the battery reports the new mode. Track it via the `user:vendor-action:updated` webhook event or Get Operation Mode Action; sending a different request cancels a pending Action, while an identical one reuses it. See Controlling devices for how Actions behave. Regardless of mode, the battery will not discharge below the user''s `dischargeLimit` reserve except in emergency power situations.'
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/PathBatteryTargetId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/setBatteryOperationModePayload'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:00Z'
                completedAt: null
                state: PENDING
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: battery
                targetState:
                  operationMode: IMPORT_FOCUS
              schema:
                $ref: '#/components/schemas/OperationModeAction'
        '400':
          description: A precondition check failed that is unlikely to change within the action's timeout window. This occurs if the battery cannot perform the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /batteries/actions/{actionId}:
    get:
      summary: Get Operation Mode Action
      description: Returns the current state of the requested Action.
      operationId: getBatteriesAction
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/ActionPathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CONFIRMED
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: battery
                targetState:
                  operationMode: IMPORT_FOCUS
              schema:
                $ref: '#/components/schemas/OperationModeAction'
        '404':
          description: Action not found.
  /batteries/actions/{actionId}/cancel:
    post:
      summary: Cancel Battery Action
      description: 'Cancels a pending battery Action, halting any further attempts by Enode to execute it.


        Note: This only updates the Action''s status to `CANCELLED` within Enode and does not reflect a change in the vendor''s cloud. Thus any pending Action in the vendor''s cloud might still be executed.'
      operationId: cancelBatteryAction
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/ActionPathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CANCELLED
                failureReason:
                  type: REQUESTED_CANCELLATION
                  detail: The action was cancelled following an external request.
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: battery
                targetState:
                  operationMode: IMPORT_FOCUS
              schema:
                $ref: '#/components/schemas/OperationModeAction'
        '404':
          description: Action not found.
        '409':
          description: Action already in a resolved state and can therefore not be cancelled.
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CONFIRMED
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: battery
                targetState:
                  operationMode: IMPORT_FOCUS
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                    x-format:
                      guid: true
                    description: The ID of the action.
                  userId:
                    type: string
                    description: The ID of the user that owns the target of this action.
                    example: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                  createdAt:
                    type: string
                    format: date-time
                    description: Time when this action was created
                    example: '2020-04-07T17:04:26Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: Time when this action was last updated
                    example: '2020-04-07T17:04:26Z'
                  completedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Time when the action transitioned to a non-pending state.
                    example: '2020-04-07T17:04:26Z'
                  targetId:
                    type: string
                    description: ID of the battery which this action is controlling.
                    example: ac03a513-5494-4e1c-9dd7-2a29dc024312
                  targetType:
                    type: string
                    enum:
                    - battery
                  targetState:
                    $ref: '#/components/schemas/setBatteryOperationModePayload'
                  failureReason:
                    allOf:
                    - $ref: '#/components/schemas/ActionFailureReason'
                  state:
                    type: string
                    enum:
                    - CONFIRMED
                    - FAILED
                    - CANCELLED
                    description: "The real-time status of an action executed on a target. \n\n * `CONFIRMED`: Successful transition of the target to the desired state. \n * `FAILED`: The target did not respond to the action before timing out. Enode has ceased sending additional commands. \n * `CANCELLED`: A required precondition was not met during the action's timeout window or another action has been sent to the target, overriding this one."
                required:
                - id
                - userId
                - createdAt
                - updatedAt
                - completedAt
                - targetId
                - targetType
                - targetState
                - failureReason
                - state
                additionalProperties: false
  /batteries/{batteryId}/refresh-hint:
    post:
      summary: Refresh Battery Data
      description: 'Use this endpoint to initiate an expedited data refresh for the specified battery.


        Note: The Enode platform keeps data automatically up-to-date and detects changes in the OEM APIs within seconds to a few minutes. We change the refresh interval dynamically based on a number of heuristics. This ensures we find the best trade-off between the stability of the connection to the OEM and freshness of the data.

        This method overrides most of our heuristics and should therefore be used with caution. You may use it when you have a strong reason to believe the data might be stale.'
      operationId: batteriesRefreshHint
      tags:
      - Batteries
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/PathBatteryTargetId'
      responses:
        '204':
          description: Refresh hint registered successfully.
          content: {}
        '404':
          description: The specified battery was not found.
        '429':
          description: Rate limited. Retry after the number of seconds given in the Retry-After header.
          headers:
            Retry-After:
              schema:
                type: string
                pattern: ^\d+$
                description: Seconds until the current UTC hour resets and another refresh hint can be submitted.
                example: '1800'
              required: true
              description: Seconds until the current UTC hour resets and another refresh hint can be submitted.
          content:
            application/problem+json:
              example:
                type: https://docs.enode.io/api/problems/rate-limited
                title: Rate limited
                detail: You have reached the maximum number of 9 refresh-hints per hour for this device.
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    ActionState:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - FAILED
      - CANCELLED
      description: "The real-time status of an action executed on a target. \n\n * `PENDING`: The initial state. Enode is actively sending commands and monitoring the target for changes. \n * `CONFIRMED`: Successful transition of the target to the desired state. \n * `FAILED`: The target did not respond to the action before timing out. Enode has ceased sending additional commands. \n * `CANCELLED`: A required precondition was not met during the action's timeout window or another action has been sent to the target, overriding this one."
    Brand:
      type: string
      description: A formatted and properly cased OEM brand name, suitable for reading by humans. May contain special characters.
      example: Tesla
    setBatteryOperationModePayload:
      type: object
      properties:
        operationMode:
          type: string
          enum:
          - IMPORT_FOCUS
          - EXPORT_FOCUS
          - TIME_OF_USE
          - SELF_RELIANCE
          - IDLE
          description: "Desired operation mode of the battery.\n\n * `SELF_RELIANCE`: The battery optimizes itself to maximize self-consumption: it charges from solar surplus if available, discharges to cover household load, and the household only imports from the grid when both fall short. Excess solar may still be exported to the grid. This is the default mode on most batteries.\n * `TIME_OF_USE`: The battery optimizes itself against an electricity price schedule configured in the manufacturer's app: it charges when electricity is cheap and discharges when it is expensive. Energy may flow to or from the grid depending on prices and the user's settings.\n * `IMPORT_FOCUS`: Steers the battery to charge from any available source. Use this to increase household demand, fill the battery ahead of high prices, or support other optimization strategies.\n * `EXPORT_FOCUS`: Steers the battery to discharge: powers the household first and exports any excess to the grid where allowed. Use this to decrease household demand by releasing stored energy or support grid shortfalls.\n * `IDLE`: Holds the current charge level: the battery neither charges nor discharges. Use this to pass solar production through to the household or grid, or to hold the battery's charge for later.\n\nAll modes set a **target behavior**. Actual behavior can vary with the device's configuration, the user's settings in the manufacturer's app, reserve limits, and local grid rules."
          example: IMPORT_FOCUS
        powerLimit:
          type: number
          description: Requested charge or discharge power in kW. Omit for the battery's own maximum. Rejected when the battery reports no allowed range for the selected mode, or when the value falls outside that range. Zero and negative values are rejected, because stopping is the `IDLE` mode rather than a rate. Ignored for modes which do not modulate power.
          example: 3.7
          exclusiveMinimum: 0
      required:
      - operationMode
      additionalProperties: false
      description: Target battery operation mode
    Capability:
      type: object
      properties:
        isCapable:
          type: boolean
          description: The entity is fully capable of providing this data or functionality. If false, support is partial or missing. A capable entity (`true`) may still list recommended interventions in `interventionIds`.
          example: false
        interventionIds:
          type: array
          items:
            type: string
            example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
            x-format:
              guid: true
          description: 'IDs of interventions the user can make to alter the availability of this capability.

            Interventions may be present even when `isCapable` is `true` (recommended, non-blocking actions). See [the interventions guide](/docs/interventions#accessing-interventions-via-our-api).'
      required:
      - isCapable
      - interventionIds
      additionalProperties: false
    BatteryChargeState:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/BatteryStatus'
        batteryCapacity:
          type:
          - number
          - 'null'
          description: Battery capacity in kWh.
          example: 13.5
        batteryLevel:
          type:
          - number
          - 'null'
          description: Remaining battery charge level in percent.
          example: 80
        chargeRate:
          type:
          - number
          - 'null'
          description: The current charge rate in kW. A positive value indicates that the battery is charging.
          example: 4.6
        dischargeLimit:
          type:
          - number
          - 'null'
          description: Minimum charge level for a battery, expressed as a percentage. Batteries will not discharge below this user-set reserve level except in emergency power situations.
          example: 20
        lastUpdated:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of last received charge state update
          example: '2020-04-07T17:04:26Z'
      required:
      - status
      - batteryCapacity
      - batteryLevel
      - chargeRate
      - dischargeLimit
      - lastUpdated
      additionalProperties: false
      description: Latest information about the battery. `null` values indicate we are unable to determine a value for the field based on the information coming from the vendor.
    PaginationQueryAfter:
      type: string
      description: Opaque cursor used to fetch next page. Cannot be set together with `before`. Refer to [Pagination](/api#pagination) for more information.
      example: MjAyMy0wNy0xOFQxMDowODowMi4zNzNa
    BatteryOperationMode:
      type: string
      enum:
      - IMPORT_FOCUS
      - EXPORT_FOCUS
      - TIME_OF_USE
      - SELF_RELIANCE
      - IDLE
      - UNKNOWN
      description: "The current operation mode of the battery.\n\n * `SELF_RELIANCE`: The battery optimizes itself to maximize self-consumption: it charges from solar surplus if available, discharges to cover household load, and the household only imports from the grid when both fall short. Excess solar may still be exported to the grid. This is the default mode on most batteries.\n * `TIME_OF_USE`: The battery optimizes itself against an electricity price schedule configured in the manufacturer's app: it charges when electricity is cheap and discharges when it is expensive. Energy may flow to or from the grid depending on prices and the user's settings.\n * `IMPORT_FOCUS`: Steers the battery to charge from any available source. Use this to increase household demand, fill the battery ahead of high prices, or support other optimization strategies.\n * `EXPORT_FOCUS`: Steers the battery to discharge: powers the household first and exports any excess to the grid where allowed. Use this to decrease household demand by releasing stored energy or support grid shortfalls.\n * `IDLE`: Holds the current charge level: the battery neither charges nor discharges. Use this to pass solar production through to the household or grid, or to hold the battery's charge for later.\n * `UNKNOWN`: Reported when Enode cannot map the manufacturer's current mode to one of the modes above. This value cannot be set; the battery can usually be moved out of it by setting one of the modes above.\n\nAll modes set a **target behavior**. Actual behavior can vary with the device's configuration, the user's settings in the manufacturer's app, reserve limits, and local grid rules."
    PaginationQueryBefore:
      type: string
      description: Opaque cursor used to fetch previous page. Cannot be used together with `after`. Refer to [Pagination](/api#pagination) for more information.
      example: MjAyMy0wNy0xOFQxMDowODowMi4zNzNa
    OperationModeAction:
      type: object
      properties:
        id:
          type: string
          example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
          x-format:
            guid: true
          description: The ID of the action.
        userId:
          type: string
          description: The ID of the user that owns the target of this action.
          example: bb28471e-cde6-4eff-ace4-9a7f4f50882a
        createdAt:
          type: string
          format: date-time
          description: Time when this action was created
          example: '2020-04-07T17:04:26Z'
        updatedAt:
          type: string
          format: date-time
          description: Time when this action was last updated
          example: '2020-04-07T17:04:26Z'
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Time when the action transitioned to a non-pending state.
          example: '2020-04-07T17:04:26Z'
        state:
          $ref: '#/components/schemas/ActionState'
        targetId:
          type: string
          description: ID of the battery which this action is controlling.
          example: ac03a513-5494-4e1c-9dd7-2a29dc024312
        targetType:
          type: string
          enum:
          - battery
        targetState:
          $ref: '#/components/schemas/setBatteryOperationModePayload'
        failureReason:
          allOf:
          - $ref: '#/components/schemas/ActionFailureReason'
      required:
      - id
      - userId
      - createdAt
      - updatedAt
      - completedAt
      - state
      - targetId
      - targetType
      - targetState
      - failureReason
      additionalProperties: false
      title: Battery Operation Mode Action
    BatteryVendor:
      type: string
      enum:
      - ENPHASE
      - GIVENERGY
      - FOXESS
      - HUAWEI
      - SMA
      - SOLAREDGE
      - SOLAX
      - SOLIS
      - TESLA
      - SUNGROW
      - GROWATT
      description: Machine-friendly name of the vendor. Use this in API requests.
      example: TESLA
    BatteryInformation:
      type: object
      properties:
        id:
          type: string
          description: Battery vendor ID
          example: 7deb27f8-794f-467b-855e-5c61dd9f2cb3
        brand:
          $ref: '#/components/schemas/Brand'
        model:
          type: string
          description: Battery model
          example: Powerwall
        siteName:
          type: string
          description: Name of the site, as set by the user on the device/vendor. If no user-specified name is available, we construct a fallback name using the vendor/device/model names.
          example: Powerwall Home
        installationDate:
          type: string
          format: date-time
          description: Battery installation date
          example: '2020-04-07T17:04:26Z'
      required:
      - id
      - brand
      - model
      - siteName
      - installationDate
      additionalProperties: false
      description: Descriptive information about the battery
    PathBatteryId:
      type: string
      description: The ID of the battery to look up.
      example: 54d827e1-8355-4fed-97b5-55940d1d09ba
    UserPathId:
      type: string
      description: ID of the User.
    PaginationQueryPageSize:
      type: integer
      description: Number of records to return per page. Default page size is 50.
      example: 50
      exclusiveMinimum: 0
    BatteryConfig:
      type: object
      properties:
        operationMode:
          allOf:
          - $ref: '#/components/schemas/BatteryOperationMode'
        powerLimit:
          type:
          - number
          - 'null'
          description: Power setting in kW reported by the vendor for the current operation. This is a reported setting, not measured power. `null` means the vendor has not reported an active setting. It can remain `null` after a request is accepted.
          example: 3.7
        lastUpdated:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of last received configuration update
          example: '2020-04-07T17:04:26Z'
      required:
      - operationMode
      - powerLimit
      - lastUpdated
      additionalProperties: false
    PathBatteryTargetId:
      type: string
      description: The ID of the battery being targeted.
      example: 54d827e1-8355-4fed-97b5-55940d1d09ba
    ActionPathId:
      type: string
      example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
      x-format:
        guid: true
      description: ID of the Action.
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        issues:
          type: array
          items:
            type: object
            properties: {}
          description: A list of validation issues which occurred while validating some component of the network payload.
      required:
      - type
      - title
      - detail
      description: Standard Problem Error
      example:
        type: https://docs.enode.io/api/problems/not-found
        title: Not Found
        detail: The requested asset wasn't found.
    BatteryLocation:
      type: object
      properties:
        longitude:
          type:
          - number
          - 'null'
          description: Longitude in degrees
          example: 10.7197486
        latitude:
          type:
          - number
          - 'null'
          description: Latitude in degrees
          example: 59.9173985
      required:
      - longitude
      - latitude
      additionalProperties: false
      description: Battery's GPS coordinates
    PaginatedBatteryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Battery'
          description: Paginated list of batteries
        pagination:
          $ref: '#/components/schemas/PaginationCursors'
      required:
      - data
      - pagination
      additionalProperties: false
      description: Paginated response of batteries
    BatteryCapabilities:
      type: object
      properties:
        exportFocus:
          allOf:
          - $ref: '#/components/schemas/BatteryModePowerLimitCapability'
          description: Supports EXPORT_FOCUS operation mode.
        importFocus:
          allOf:
          - $ref: '#/components/schemas/BatteryModePowerLimitCapability'
          description: Supports IMPORT_FOCUS operation mode.
        timeOfUse:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports TIME_OF_USE operation mode.
        selfReliance:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports SELF_RELIANCE operation mode.
        idle:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports IDLE operation mode.
      required:
      - exportFocus
      - importFocus
      - timeOfUse
      - selfReliance
      - idle
      additionalProperties: false
      description: A collection of descriptors that describe the capabilities of this specific battery
    BatteryStatus:
      type: string
      enum:
      - CHARGING
      - DISCHARGING
      - IDLE
      - FAULT
      - UNKNOWN
      description: The power delivery state of the battery.
      example: CHARGING
    BatteryModePowerLimitCapability:
      type: object
      properties:
        isCapable:
          type: boolean
          description: The entity is fully capable of providing this data or functionality. If false, support is partial or missing. A capable entity (`true`) may still list recommended interventions in `interventionIds`.
          example: false
        interventionIds:
          type: array
          items:
            type: string
            example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
            x-format:
              guid: true
          description: 'IDs of interventions the user can make to alter the availability of this capability.

            Interventions may be present even when `isCapable` is `true` (recommended, non-blocking actions). See [the interventions guide](/docs/interventions#accessing-interventions-via-our-api).'
        powerLimit:
          type: object
          properties:
            allowedRange:
              type: object
              properties:
                kW:
                  type: object
                  properties:
                    min:
                      type:
                      - number
                      - 'null'
                      description: Minimum selectable power in kW. `null` when Enode cannot offer a verified range for this mode.
                    max:
                      type:
                      - number
                      - 'null'
                      description: Maximum selectable power in kW. `null` when Enode cannot offer a verified range for this mode.
                  required:
                  - min
                  - max
                  additionalProperties: false
              required:
              - kW
              additionalProperties: false
          required:
          - allowedRange
          additionalProperties: false
      required:
      - isCapable
