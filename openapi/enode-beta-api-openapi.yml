    PaginationQueryAfter:
      type: string
      description: Opaque cursor used to fetch next page. Cannot be set together with `before`. Refer to [Pagination](/api#pagination) for more information.
      example: MjAyMy0wNy0xOFQxMDowODowMi4zNzNa
    BatteryOperationMode:
      type: string
      enum:
      - IMPORT_FOCUS
      - EXPORT_FOCUS
      - TIME_OF_USE
      - SELF_RELIANCE
      - IDLE
      - UNKNOWN
      description: "The current operation mode of the battery.\n\n * `SELF_RELIANCE`: The battery optimizes itself to maximize self-consumption: it charges from solar surplus if available, discharges to cover household load, and the household only imports from the grid when both fall short. Excess solar may still be exported to the grid. This is the default mode on most batteries.\n * `TIME_OF_USE`: The battery optimizes itself against an electricity price schedule configured in the manufacturer's app: it charges when electricity is cheap and discharges when it is expensive. Energy may flow to or from the grid depending on prices and the user's settings.\n * `IMPORT_FOCUS`: Steers the battery to charge from any available source. Use this to increase household demand, fill the battery ahead of high prices, or support other optimization strategies.\n * `EXPORT_FOCUS`: Steers the battery to discharge: powers the household first and exports any excess to the grid where allowed. Use this to decrease household demand by releasing stored energy or support grid shortfalls.\n * `IDLE`: Holds the current charge level: the battery neither charges nor discharges. Use this to pass solar production through to the household or grid, or to hold the battery's charge for later.\n * `UNKNOWN`: Reported when Enode cannot map the manufacturer's current mode to one of the modes above. This value cannot be set; the battery can usually be moved out of it by setting one of the modes above.\n\nAll modes set a **target behavior**. Actual behavior can vary with the device's configuration, the user's settings in the manufacturer's app, reserve limits, and local grid rules."
    PaginationQueryBefore:
      type: string
      description: Opaque cursor used to fetch previous page. Cannot be used together with `after`. Refer to [Pagination](/api#pagination) for more information.
      example: MjAyMy0wNy0xOFQxMDowODowMi4zNzNa
