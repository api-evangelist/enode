components:
  schemas:
    InverterStatistics:
      type: object
      properties:
        production:
          allOf:
          - $ref: '#/components/schemas/InverterStatisticsBuckets'
          description: Contains information about power production statistics.
      required:
      - production
      additionalProperties: false
      example:
        production:
          unit: kWh
          data:
          - date: '2024-01-19T09:00:00.000Z'
            value: 11.1
          - date: '2024-01-19T10:00:00.000Z'
            value: 15.4
    sessionsStatisticsTimeseries:
      type: array
      items:
        type: object
        properties:
          kw:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate statistics in kW for the session
          kwhSum:
            type: number
            description: Total power consumption in kWh for the session
            example: 120
          price:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate per kWh price statistics for the session. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
          costSum:
            type: number
            description: Total cost for the consumed kWh for this session
            example: 3.14
          id:
            type: string
            description: ID of the asset for this session.
          locationId:
            type:
            - string
            - 'null'
            example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
            x-format:
              guid: true
            description: Location ID for this session.
          from:
            type: string
            format: date-time
            description: Start time of the session.
            example: '2020-04-07T17:04:26Z'
          to:
            type: string
            format: date-time
            description: End time of the session.
            example: '2020-04-07T17:04:26Z'
          nonSmartPrice:
            allOf:
            - $ref: '#/components/schemas/NullableAggregates'
            description: If Smart Charging has actively stopped the charging session from happening at another time; these fields show the aggregate per kWh price statistics that would have occurred without Smart Charging. This can be used to show the potential price if Smart Charging had not been active. min, max and mean are each null if no part of this session was impacted by Smart Charging. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
          estimatedSavings:
            type:
            - number
            - 'null'
            description: Total estimated savings achieved by Smart Charging for this session. If null, no part of this session was impacted by Smart Charging. This is expressed in NOK unless different price data has been provided via the Tariffs endpoints
            example: 1.07
        required:
        - kw
        - kwhSum
        - price
        - costSum
        - id
        - locationId
        - from
        - to
        - nonSmartPrice
        - estimatedSavings
        additionalProperties: false
    chargingStatisticsTimeseries:
      type: array
      items:
        type: object
        properties:
          kw:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate statistics in kW for the time bucket
          kwhSum:
            type: number
            description: Total power consumption in kWh for the time bucket
            example: 120
          price:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate per kWh price statistics for the time bucket. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
          costSum:
            type: number
            description: Total cost for the consumed kWh for the time bucket
            example: 3.14
          nonSmartPrice:
            allOf:
            - $ref: '#/components/schemas/NullableAggregates'
            description: Aggregate per kWh price statistics for the time bucket if Smart Charging has actively stopped consumption from occurring during this `resolution`. This can be used to show the potential price if Smart Charging had not been active. `min`, `max` and `mean` are each `null` if no part of this `resolution` was impacted by Smart Charging. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
          estimatedSavings:
            type:
            - number
            - 'null'
            description: Total estimated savings achieved by Smart Charging for this `resolution`. If `null`, no part of this `resolution` was impacted by Smart Charging. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
            example: 1.07
          date:
            type: string
            format: date-time
            description: The start of this `resolution` bucket. For calendar resolutions with `utcOffset`, this is a local wall-clock label encoded with a `Z` suffix.
            example: '2020-04-07T17:04:26Z'
        required:
        - kw
        - kwhSum
        - price
        - costSum
        - nonSmartPrice
        - estimatedSavings
        - date
        additionalProperties: false
      example:
      - kw:
          min: 0
          max: 78
          mean: 61
        kwhSum: 120
        price:
          min: 13.8
          max: 14.4
          mean: 14.1
        nonSmartPrice:
          min: 12.9
          max: 16.7
          mean: 14.8
        costSum: 3.14
        estimatedSavings: 1.07
        date: '2021-01-19T09:37:36.845Z'
    productionStatisticsTimeseries:
      type: array
      items:
        type: object
        properties:
          kw:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate statistics for production rate in kW
          kwhSum:
            type: number
            description: Total power production in kWh
            example: 120
          price:
            allOf:
            - $ref: '#/components/schemas/Aggregates'
            description: Aggregate per kWh price statistics for the time bucket. Currency is `NOK` for Norway, Sweden, Denmark, Finland, Estonia, Latvia, Lithuania; and `EUR` for Austria, Belgium, Germany, France, Netherlands, Poland, Spain. Unless different price data has been provided via the Tariffs endpoints
          earningsSum:
            type: number
            description: Uses the local day ahead market price to determine the total value of the energy produced during the time bucket. Requires the user to have a [Location](/api#locations) at the same geo coordinates as the inverter itself. This is expressed in NOK unless different price data has been provided via the Tariffs endpoints
            example: 3.14
          date:
            type: string
            format: date-time
            description: The start of this sample's bucket. For calendar resolutions with `utcOffset`, this is a local wall-clock label encoded with a `Z` suffix.
            example: '2020-04-07T17:04:26Z'
        required:
        - kw
        - kwhSum
        - price
        - earningsSum
        - date
        additionalProperties: false
      example:
      - kw:
          min: 0
          max: 78
          mean: 61
        kwhSum: 120
        price:
          min: 13.8
          max: 14.4
          mean: 14.1
        earningsSum: 3.14
        date: '2021-01-19T09:37:36.845Z'
    InverterStatisticsTimeseriesBucket:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Date (UTC) at the start of the data point.
          example: '2023-01-19T09:00:00.000Z'
        value:
          type: number
          description: The energy produced (kWh) in the specified interval.
          example: 1.1
      required:
      - date
      - value
      additionalProperties: false
    NullableAggregates:
      type: object
      properties:
        min:
          type:
          - number
          - 'null'
          description: The minimum amount for this period.
        max:
          type:
          - number
          - 'null'
          description: The maximum amount for this period.
        mean:
          type:
          - number
          - 'null'
          description: The average for this period.
      required:
      - min
      - max
      - mean
      additionalProperties: false
    InverterStatisticsBuckets:
      type: object
      properties:
        unit:
          type: string
          enum:
          - kWh
          description: The unit of measurement for power production data. Always kWh.
          example: kWh
        data:
          type: array
          items:
            $ref: '#/components/schemas/InverterStatisticsTimeseriesBucket'
          description: An array of data points representing the power production statistics.
          example:
          - date: '2021-01-19T09:37:36.845Z'
            value: 1.1
      required:
      - unit
      - data
      additionalProperties: false
    Aggregates:
      type: object
      properties:
        min:
          type: number
          description: The minimum amount for this period.
        max:
          type: number
          description: The maximum amount for this period.
        mean:
          type: number
          description: The average for this period.
      required:
      - min
      - max
      - mean
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        issues:
          type: array
          items:
            type: object
            properties: {}
          description: A list of validation issues which occurred while validating some component of the network payload.
      required:
      - type
      - title
      - detail
      description: Standard Problem Error
      example:
        type: https://docs.enode.io/api/problems/not-found
        title: Not Found
        detail: The requested asset wasn't found.
