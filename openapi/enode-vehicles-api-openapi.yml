          - string
          - 'null'
          format: date-time
          description: During a Smart Charging Plan, the first time at which the vehicle's charging was confirmed as started. If a vehicle starts charging outside of smart charging's control (e.g., via a 3rd party app), this will be populated with that timestamp.
          example: '2020-04-07T17:04:26Z'
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The time at which the Smart Charging Plan ended
          example: '2020-04-07T17:04:26Z'
        finalState:
          allOf:
          - $ref: '#/components/schemas/SmartChargingPlanFinalState'
          description: The final state of the Smart Charging Plan when it ended
        failureCondition:
          allOf:
          - $ref: '#/components/schemas/FailureCondition'
          description: If the finalState was `PLAN:ENDED:FAILED`, failureCondition is populated with the condition in which the Smart Charging Plan failed. If the finalState was `PLAN:ENDED:FINISHED`, failureCondition is populated with `FINISHED_LATE` if the plan was more than 15% late.
          example: CHARGE_INTERRUPTED
        externalStart:
          allOf:
          - $ref: '#/components/schemas/SmartOverrideStatus'
          description: Deprecated, replaced by `smartOverride` from [Get Vehicle Smart Charging Status](/api#getVehiclesVehicleidSmartchargingstatus)
          deprecated: true
        chargingLocationId:
          type:
          - string
          - 'null'
          example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
          x-format:
            guid: true
          description: Deprecated. Replaced by `locationId`. ID of the location at which the Smart Charging Plan is being executed. Null for Smart Charging Plans started before March 2022.
          deprecated: true
      required:
      - id
      - vehicleId
      - userId
      - locationId
      - vendor
      - currency
      - nonSmartCost
      - smartCost
      - stopAt
      - startAt
      - estimatedFinishAt
      - stopConfirmedAt
      - startConfirmedAt
      - endedAt
      - finalState
      - failureCondition
      - externalStart
      - chargingLocationId
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        issues:
          type: array
          items:
            type: object
            properties: {}
          description: A list of validation issues which occurred while validating some component of the network payload.
      required:
      - type
      - title
      - detail
      description: Standard Problem Error
      example:
        type: https://docs.enode.io/api/problems/not-found
        title: Not Found
        detail: The requested asset wasn't found.
    ChargeRateLimitRange:
      type: object
      properties:
        kW:
          type: object
          properties:
            min:
              type:
              - number
              - 'null'
              description: The minimum charge rate limit in kW. Returns null when unavailable from the vendor.
            max:
              type:
              - number
              - 'null'
              description: The maximum charge rate limit in kW. Returns null when unavailable from the vendor.
          required:
          - min
          - max
          additionalProperties: false
          description: Allowed charge rate limit range in kW.
      required:
      - kW
      additionalProperties: false
    TargetMaxCurrent:
      type: object
      properties:
        maxCurrent:
          type: number
          description: Desired max current in ampere
          example: 10
          exclusiveMinimum: 0
      required:
      - maxCurrent
      additionalProperties: false
      description: Target maximum current for entity
    VehicleCapabilities:
      type: object
      properties:
        information:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Full availability of information data.
        chargeState:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Full availability of chargeState data.
        location:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Full availability of location data.
        odometer:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Full availability of odometer data.
        setMaxCurrent:
          allOf:
          - $ref: '#/components/schemas/Capability'
          deprecated: true
          description: 'Deprecated: Use `setChargeRateLimit` instead.


            Supports setting the maximum charge current.'
        startCharging:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports START charging command.
        stopCharging:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports STOP charging command.
        smartCharging:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Support for smartCharging. This value is dynamic and may change over time.
        refreshState:
          allOf:
          - $ref: '#/components/schemas/Capability'
          description: Supports refreshing the vehicle state on demand. This value is dynamic and may change over time.
        setChargeRateLimit:
          allOf:
          - $ref: '#/components/schemas/ChargeRateLimitCapability'
          description: 'Ability to set the charge rate limit in kW. Only available when the vehicle is paired with a capable charger.


            Early Adopter: This property is only available for early adopters of [Set Charge Rate Limit](/api#postVehiclesVehicleidChargeRateLimit)'
      required:
      - information
      - chargeState
      - location
      - odometer
      - setMaxCurrent
      - startCharging
      - stopCharging
      - smartCharging
      additionalProperties: false
      description: 'A collection of descriptors that describe the capabilities of this specific vehicle.


        When the vehicle is paired with a linked charger, each capability''s `interventionIds` merge interventions from both assets. See [Interventions](/docs/ev-charger-pairing/overview#interventions) for how charger interventions are surfaced, when vehicle interventions are suppressed, and how the recommended `LinkAdditionalAsset` ("link a charger") intervention behaves.'
    SmartOverrideStatus:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time at which the smart override was created.
          example: '2020-04-07T17:04:26Z'
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Time at which the smart override was ended. If null, the smart override is still active.
          example: '2020-04-07T17:04:26Z'
        targetType:
          allOf:
          - $ref: '#/components/schemas/ChargeableVendorType'
          example: vehicle
        targetId:
          type: string
          description: ID of the target which this smart override is affecting.
          example: 07f8368d-be7e-4dbd-8cf0-94d00dd67ad3
        vendorActionId:
          type:
          - string
          - 'null'
          example: 213ae0a8-fb65-40be-981a-6a86df3e1c7f
          x-format:
            guid: true
          description: The ID of the Action responsible for starting charging on the target. Use the [Get Vehicle Action](/api#getVehiclesAction) or the [Get Charger Action](/api#getChargersAction) endpoints to monitor action results. Null when no start Action was queued, for example because the target was already charging.
      required:
      - createdAt
      - endedAt
      - targetType
      - targetId
      - vendorActionId
      additionalProperties: false
      description: This field populates after using Vehicle [Create Smart Override](/api#vehicleCreateSmartOverride) or Charger Create Smart Override. Once populated, the target enters an overridden state, stopping Enode from sending Smart Charging actions. The Smart Override persists until the target ceases charging for any reason or is manually ended via Vehicle [End Smart Override](/api#vehicleEndSmartOverride) or Charger End Smart Override.
    ActionFailureReason:
      type: object
      properties:
        type:
          type: string
          enum:
          - NO_RESPONSE
          - FAILED_PRECONDITION
          - CONFLICT
          - NOT_FOUND
          - UNNECESSARY
          - REQUESTED_CANCELLATION
          description: "A machine-readable high level error category.\n\n * `NO_RESPONSE`: The device did not react to our commands within the action's timeout window.  \n * `FAILED_PRECONDITION`: The device did not meet all required preconditions for this action to be executed during the action's timeout window. \n * `UNNECESSARY`: The action was not carried out given that the device was already in the desired state. \n * `CONFLICT`: A newer action for this device, or for a device paired with it, has replaced this action. This action is now abandoned.  \n * `REQUESTED_CANCELLATION`: This action was cancelled by request of the controlling owner. The controlling owner may refer to another Enode entity which initiated the command, such as a schedule or smart override. \n * `NOT_FOUND`: The device was deleted while the action was `PENDING`.\n"
        detail:
          type: string
          description: A human-readable explanation of why the action was unsuccessful.
          example: The device remained unreachable.
      required:
      - type
      - detail
      description: Information about why was this action not executed successfully.
