openapi: 3.2.0
info:
  title: Enode Vehicles API
  version: '2023-08-01'
  description: One integration, 1000+ energy devices.
  license:
    name: Enode Commercial License
    url: https://enode.com
servers:
- url: https://enode-api.production.enode.io
tags:
- name: Vehicles
  description: EVs provide charge, location, and odometer data. Vehicles can be controlled either directly using the Control Charging endpoint, or through Smart Charging and Schedules.
paths:
  /vehicles:
    get:
      summary: List Vehicles
      operationId: getVehicles
      description: Returns a paginated list of all available Vehicles
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/PaginationQueryAfter'
      - $ref: '#/components/parameters/PaginationQueryBefore'
      - $ref: '#/components/parameters/PaginationQueryPageSize'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
  /users/{userId}/vehicles:
    get:
      summary: List User Vehicles
      operationId: listUserVehicles
      description: Paginated list of user vehicles.
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/UserPathId'
      - $ref: '#/components/parameters/PaginationQueryAfter'
      - $ref: '#/components/parameters/PaginationQueryBefore'
      - $ref: '#/components/parameters/PaginationQueryPageSize'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
  /vehicles/{vehicleId}:
    get:
      summary: Get Vehicle
      operationId: getVehicle
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Vehicle'
                - type: object
                  properties:
                    locationId:
                      type:
                      - string
                      - 'null'
                      example: 07f8368d-be7e-4dbd-8cf0-94d00dd67ad3
                      x-format:
                        guid: true
                      description: ID of the location the vehicle is currently positioned at (if any).
                  required:
                  - locationId
                  additionalProperties: false
  /vehicles/{vehicleId}/max-current:
    post:
      summary: Set Max Current
      operationId: postVehiclesVehicleidMaxCurrent
      deprecated: true
      description: 'Deprecated: Use Set Charge Rate Limit instead, which accepts a target in kW.


        Set the max current the vehicle is allowed to consume during charging. Currently only supported for Tesla vehicles and behind a feature flag. Reach out to Customer Success to get access.


        This request creates an Action that will retry until the vehicle''s `maxCurrent` matches the expected value. The Action must complete before any further commands are sent to the vehicle. Only one Action can be active for a specific vehicle at a time. If a new Action is created, the previous Action will be automatically cancelled and transitioned to the `CANCELLED` state. Transitions can be tracked via the `user:vendor-action:updated` webhook event or Get Vehicle Action.'
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetMaxCurrent'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:00Z'
                completedAt: null
                state: PENDING
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                targetState:
                  maxCurrent: 10
              schema:
                $ref: '#/components/schemas/MaxCurrentAction'
        '400':
          description: A precondition check failed that is unlikely to change within the action's timeout window. This occurs if the vehicle cannot perform the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vehicles/{vehicleId}/charge-rate-limit:
    post:
      summary: Set Charge Rate Limit
      operationId: postVehiclesVehicleidChargeRateLimit
      description: 'Sets the charge rate limit for a vehicle in kW. The vehicle must be plugged into a charger that supports this capability. Creates an Action that retries until the vehicle''s `chargeRateLimit` matches the target value. Setting chargeRateLimit also changes maxCurrent.


        Only one Action can be active for a specific vehicle at a time. If a new Action is created, the previous Action will be automatically cancelled and transitioned to the `CANCELLED` state. Track transitions via the `user:vendor-action:updated` webhook event or Get Vehicle Action.


        If you are interested in joining the Early Adopter program, please reach out to Enode with a short description of your use case.'
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRateLimitPayload'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:00Z'
                completedAt: null
                state: PENDING
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                targetState:
                  chargeRateLimit: 5.2
              schema:
                $ref: '#/components/schemas/VehicleChargeRateLimitAction'
        '400':
          description: A precondition check failed. This occurs if the vehicle is not capable, not plugged in, or the charge rate limit is outside the allowed range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vehicles/actions/{actionId}:
    get:
      summary: Get Vehicle Action
      description: Returns the current state of the requested Action.
      operationId: getVehiclesAction
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/ActionPathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CONFIRMED
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                kind: START
              schema:
                $ref: '#/components/schemas/VehicleAction'
        '404':
          description: Action not found.
  /vehicles/actions/{actionId}/cancel:
    post:
      summary: Cancel Vehicle Action
      description: 'Cancels a pending vehicle action, halting any further attempts by Enode to execute it.


        Note: This only updates the action''s status to `CANCELLED` within Enode and does not reflect a change in the vendor''s cloud. Thus any pending action in the vendor''s cloud might still be executed.'
      operationId: cancelVehicleAction
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/ActionPathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CANCELLED
                failureReason:
                  type: REQUESTED_CANCELLATION
                  detail: The action was cancelled following an external request.
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                kind: START
              schema:
                $ref: '#/components/schemas/ChargeAction'
        '404':
          description: Action not found.
        '409':
          description: Action already in a resolved state.
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:12Z'
                completedAt: '2023-08-01T01:00:12Z'
                state: CONFIRMED
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                kind: START
              schema:
                $ref: '#/components/schemas/ChargeAction'
  /vehicles/{vehicleId}/refresh-hint:
    post:
      summary: Refresh Vehicle Data
      description: 'Use this endpoint to initiate an expedited data refresh for the specified vehicle.


        Note: The Enode platform keeps data automatically up-to-date and detects changes in the OEM APIs within seconds to a few minutes. We change the refresh interval dynamically based on a number of heuristics. This ensures we find the best trade-off between the stability of the connection to the OEM and freshness of the data.

        This method overrides most of our heuristics and should therefore be used with caution. You may use it when you have a strong reason to believe the data might be stale.'
      operationId: vehiclesRefreshHint
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '204':
          description: Refresh hint registered successfully.
          content: {}
        '404':
          description: The specified vehicle was not found.
        '429':
          description: Rate limited. Retry after the number of seconds given in the Retry-After header.
          headers:
            Retry-After:
              schema:
                type: string
                pattern: ^\d+$
                description: Seconds until the current UTC hour resets and another refresh hint can be submitted.
                example: '1800'
              required: true
              description: Seconds until the current UTC hour resets and another refresh hint can be submitted.
          content:
            application/problem+json:
              example:
                type: https://docs.enode.io/api/problems/rate-limited
                title: Rate limited
                detail: You have reached the maximum number of 9 refresh-hints per hour for this device.
              schema:
                $ref: '#/components/schemas/Problem'
  /vehicles/{vehicleId}/charging:
    post:
      summary: Control Charging
      operationId: postVehiclesVehicleidCharging
      description: 'Request for a vehicle to start or stop charging. This request creates an Action that will retry until the vehicle''s `powerDeliveryState` matches the expected value. The Action must complete before any further commands are sent to the vehicle. If a `PENDING` action for the same target and type already exists, it will be reused and a new action will not be created. If the new Action has a different target or type, the existing Action will be automatically transitioned to the `CANCELLED` state and a new Action will be created. Transitions can be tracked via the `user:vendor-action:updated` webhook event or Get Vehicle Action.


        This endpoint returns an error with status code 422 if the vehicle is controlled by a schedule or has an active smart charging plan. To restore user control, either disable the schedule, disable smart charging, or use Create Smart Override to temporarily enable charging.'
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  allOf:
                  - $ref: '#/components/schemas/ChargingAction'
                  description: Charging action to perform
              required:
              - action
              additionalProperties: false
      responses:
        '200':
          description: Resulting charge action
          content:
            application/json:
              example:
                id: 4eaeb363-296d-4ccc-a973-7805e6f400bd
                userId: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                createdAt: '2023-08-01T01:00:00Z'
                updatedAt: '2023-08-01T01:00:00Z'
                completedAt: null
                state: PENDING
                failureReason: null
                targetId: f723fed5-73aa-4004-b7f0-89e5173ee15e
                targetType: vehicle
                kind: START
              schema:
                $ref: '#/components/schemas/ChargeAction'
        '400':
          description: A precondition check failed that is unlikely to change within the action's timeout window. This occurs if the vehicle cannot perform the action, is fully charged, or is already in the desired state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Vehicle controlled by a Schedule or has active Smart Charging Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vehicles/{vehicleId}/smart-charging-plans/{smartChargingPlanId}:
    get:
      summary: Get Smart Charging Plan
      description: 'Check status of current or historical Smart Charging Plans for a Vehicle. Returns a Smart Charging Plan for this vehicle.


        To fetch the most recently created Plan, call the endpoint with `smartChargingPlanId` set to `latest`.'
      operationId: getVehiclesVehicleidSmartchargingplans
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      - $ref: '#/components/parameters/SmartChargingPlanPathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartChargingPlan'
  /vehicles/{vehicleId}/smart-charging-policy:
    get:
      summary: Get Vehicle Smart Charging Policy
      description: Get a vehicle's Smart Charging policy
      operationId: getVehiclesVehicleidSmartchargingpolicy
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSmartChargingPolicy'
    put:
      summary: Update Vehicle Smart Charging Policy
      operationId: updateVehicleSmartChargingPolicy
      description: Updates the Smart Charging policy for a vehicle
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialVehicleSmartChargingPolicy'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSmartChargingPolicy'
        '400':
          description: 'Bad Request. For example: another user has activated smart charging for the same vehicle, missing deadline, maxChargeLimit < minChargeLimit, minChargeLimit below threshold for vendor or user does not have a price area or tariffs.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: A URI reference that identifies the problem type.
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                  issues:
                    type: array
                    items:
                      type: object
                      properties: {}
                    description: A list of validation issues which occurred while validating some component of the network payload.
                required:
                - type
                - title
                - detail
                description: Various Bad Request errors. Title and detail can vary.
                example:
                  type: https://docs.enode.io/api/problems/bad-request
                  title: Cannot activate smart charging
                  detail: Another user already has smart charging enabled for this vehicle
  /vehicles/{vehicleId}/smart-override:
    post:
      summary: Create Smart Override
      operationId: vehicleCreateSmartOverride
      description: Overrides an active smart feature by forcing the vehicle to start charging. This feature is meant to be used in situations where the user wants to charge immediately without disabling other smart features. The override remains active until the vehicle stops charging, or until End Smart Override is called. When the override ends, the overridden smart feature will regain control of the vehicle. This endpoint should not be used for standard charge control, use Control Charging instead.
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SmartOverrideStatus'
                - type: object
                  properties:
                    userId:
                      type: string
                      description: ID of the User
                      example: 0bec82e0-0d54-4f2f-83b1-5b248604de0b
                    vendor:
                      $ref: '#/components/schemas/ChargeableVendor'
                  required:
                  - userId
                  - vendor
                  additionalProperties: false
                description: This field populates after using Vehicle [Create Smart Override](/api#vehicleCreateSmartOverride) or Charger Create Smart Override. Once populated, the target enters an overridden state, stopping Enode from sending Smart Charging actions. The Smart Override persists until the target ceases charging for any reason or is manually ended via Vehicle [End Smart Override](/api#vehicleEndSmartOverride) or Charger End Smart Override.
        '400':
          description: 'No override was created: there is no smart feature to override, or a charging start Action was rejected for a plugged-in vehicle that is not charging. Action rate limits return `429` instead.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: End Smart Override
      operationId: vehicleEndSmartOverride
      description: Ends any active Smart Override for the vehicle specified by `vehicleId`. If previously configured, Schedules or Smart Charging will resume control over the target vehicle. Note that this does not mean the vehicle will stop charging, only that it will return to the state expected by the active Schedule or Smart Charging Plan.
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SmartOverrideStatus'
                - type: object
                  properties:
                    userId:
                      type: string
                      description: ID of the User
                      example: 0bec82e0-0d54-4f2f-83b1-5b248604de0b
                    vendor:
                      $ref: '#/components/schemas/ChargeableVendor'
                  required:
                  - userId
                  - vendor
                  additionalProperties: false
                description: This field populates after using Vehicle [Create Smart Override](/api#vehicleCreateSmartOverride) or Charger Create Smart Override. Once populated, the target enters an overridden state, stopping Enode from sending Smart Charging actions. The Smart Override persists until the target ceases charging for any reason or is manually ended via Vehicle [End Smart Override](/api#vehicleEndSmartOverride) or Charger End Smart Override.
        '404':
          description: No Smart Override Exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vehicles/{vehicleId}/smart-charging-status:
    get:
      summary: Get Vehicle Smart Charging Status
      description: Every vehicle in Enode has a Smart Charging Status that describes the vehicle in terms of smart charging.
      operationId: getVehiclesVehicleidSmartchargingstatus
      tags:
      - Vehicles
      security:
      - ClientAccessToken: []
      parameters:
      - $ref: '#/components/parameters/VehiclePathId'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedAt:
                    type: string
                    format: date-time
                    description: Time when the Smart Charging Status was recalculated, irrespective of whether or not any values changed
                    example: '2020-04-07T17:04:26Z'
                  vehicleId:
                    type: string
                    description: ID of the vehicle to which this Smart Charging Status represents
                    example: 4b5ada14-ea87-4ca1-aab9-3c979c34cf4a
                  userId:
                    type: string
                    description: ID of the user that owns this vehicle
                    example: bb28471e-cde6-4eff-ace4-9a7f4f50882a
                  vendor:
                    allOf:
                    - $ref: '#/components/schemas/VehicleVendor'
                    description: Vendor of the Vehicle
                  state:
                    $ref: '#/components/schemas/SmartChargeState'
                  stateChangedAt:
                    type: string
                    format: date-time
                    description: Time when the `state` property transitioned to its current value
                    example: '2020-04-07T17:04:26Z'
                  consideration:
                    $ref: '#/components/schemas/Consideration'
                  plan:
                    allOf:
                    - $ref: '#/components/schemas/SmartChargingPlan'
                    description: '`null` by default, but during all of the `PLAN:*` states,  the value is populated with a description of the active plan'
                  smartOverride:
                    allOf:
                    - $ref: '#/components/schemas/SmartOverrideStatus'
                required:
                - updatedAt
                - vehicleId
                - userId
                - vendor
                - state
                - stateChangedAt
                - consideration
                - plan
                - smartOverride
                additionalProperties: false
components:
  schemas:
    SmartChargingPlanPathId:
      type: string
      description: ID of the Smart Charging Plan, or 'latest' to fetch the most recent plan.
      example: latest
    ChargingAction:
      type: string
      enum:
      - START
      - STOP
    VehicleVendor:
      type: string
      enum:
      - ACURA
      - AUDI
      - BMW
      - JAGUAR
      - LANDROVER
      - MINI
      - PORSCHE
      - RENAULT
      - SEAT
      - SKODA
      - TESLA
      - VOLKSWAGEN
      - VOLVO
      - XPENG
      - KIA
      - HYUNDAI
      - PEUGEOT
      - OPEL
      - DS
      - MERCEDES
      - FORD
      - TOYOTA
      - LEXUS
      - NISSAN
      - CITROEN
      - CUPRA
      - VAUXHALL
      - FIAT
      - RIVIAN
      - NIO
      - CHEVROLET
      - CADILLAC
      - GMC
      - HONDA
      - POLESTAR
      - SUBARU
      - JEEP
      - MAZDA
      - MG
      - CHRYSLER
      - DODGE
      - RAM
      - ALFAROMEO
      - LANCIA
      - LUCID
      - BYD
      - DACIA
      - ALPINE
      - LEAPMOTOR
      - SMART
      - OMODA
      description: Machine-friendly name of the vendor. Use this in API requests.
      example: TESLA
    Consideration:
      type:
      - object
      - 'null'
      properties:
        isPluggedIn:
          type: boolean
          description: The vehicle is plugged in
        isCharging:
          type: boolean
          description: The vehicle is charging
        atChargingLocation:
          type: boolean
          description: The vehicle is located at a configured Charging Location
        hasTimeEstimate:
          type: boolean
          description: A good estimate is available of how much time it will take to charge.
      required:
      - isPluggedIn
      - isCharging
      - atChargingLocation
      - hasTimeEstimate
      additionalProperties: false
    VehicleChargeRateLimitAction:
      type: object
      properties:
        id:
          type: string
          example: 4eaeb363-296d-4ccc-a973-7805e6f400bd
          x-format:
            guid: true
          description: The ID of the action.
        userId:
          type: string
          description: The ID of the user that owns the target of this action.
          example: bb28471e-cde6-4eff-ace4-9a7f4f50882a
        createdAt:
          type: string
          format: date-time
          description: Time when this action was created
          example: '2020-04-07T17:04:26Z'
        updatedAt:
          type: string
          format: date-time
          description: Time when this action was last updated
          example: '2020-04-07T17:04:26Z'
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Time when the action transitioned to a non-pending state.
          example: '2020-04-07T17:04:26Z'
        state:
          $ref: '#/components/schemas/ActionState'
        targetId:
          type: string
          description: ID of the entity which this action is controlling.
        targetState:
          $ref: '#/components/schemas/ChargeRateLimitPayload'
        failureReason:
          allOf:
          - $ref: '#/components/schemas/ActionFailureReason'
        targetType:
          type: string
          enum:
          - vehicle
      required:
      - id
      - userId
      - createdAt
      - updatedAt
      - completedAt
      - state
      - targetId
      - targetState
      - failureReason
      - targetType
      additionalProperties: false
      title: Vehicle Charge Rate Limit Action
    ActionState:
      type: string
      enum:
      - PENDING
      - CONFIRMED
      - FAILED
      - CANCELLED
      description: "The real-time status of an action executed on a target. \n\n * `PENDING`: The initial state. Enode is actively sending commands and monitoring the target for changes. \n * `CONFIRMED`: Successful transition of the target to the desired state. \n * `FAILED`: The target did not respond to the action before timing out. Enode has ceased sending additional commands. \n * `CANCELLED`: A required precondition was not met during the action's timeout window or another action has been sent to the target, overriding this one."
    Brand:
      type: string
      description: A formatted and properly cased OEM brand name, suitable for reading by humans. May contain special characters.
      example: Tesla
    VehicleSmartChargingPolicy:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: When enabled, this vehicle's charging status may be controlled by [Smart Charging](/docs/smart-charging/introduction)
        deadline:
          type:
          - string
          - 'null'
          pattern: ^(((?:[01]\d|2[0-3]):[0-5]\d)|24:00)$
          description: The hour-minute deadline for fully charging the vehicle. Smart charging does not work without setting a deadline. If a timezone is set on the location at which the smart charging occurs, the deadline is interpreted in that timezone, otherwise UTC is used.
          example: 07:00
        minimumChargeLimit:
          type: number
          description: Proceed to charge promptly, disregarding energy prices, until the vehicle achieves this preset minimum limit. Please note that this limit cannot exceed the vehicle's maximum charge limit. The default setting is zero. The unit of measure is percentage.
      required:
      - isEnabled
      - deadline
      - minimumChargeLimit
