      example: USD
    VehicleChargeState:
      type: object
      properties:
        batteryLevel:
          type:
          - number
          - 'null'
          description: Remaining battery in percent
          example: 66
        range:
          type:
          - number
          - 'null'
          description: Estimated remaining kilometers
          example: 228
        isPluggedIn:
          type:
          - boolean
          - 'null'
          description: Indicates whether the vehicle is connected to a charging box (regardless of whether it is actually charging)
          example: true
        isCharging:
          type:
          - boolean
          - 'null'
          description: Indicates whether the vehicle is currently receiving power from the charger and actively charging its battery.
          example: true
        isFullyCharged:
          type:
          - boolean
          - 'null'
          description: Indicates whether the vehicle is fully charged. 'Fully charged' may be a `batteryLevel` of less than 100 if a `chargeLimit` has been configured in the vehicle. This will be `null` when `powerDeliveryState` is `UNKNOWN`.
          example: false
        batteryCapacity:
          type:
          - number
          - 'null'
          description: Vehicle's usable battery capacity in kWh.
          example: 48.1
        chargeLimit:
          type:
          - number
          - 'null'
          description: 'Charge limit, as a percent of `batteryCapacity`.


            When `null`, the vendor did not report a charge limit when we last received data from them. We recommend assuming the limit is 100%.'
          example: 90
        chargeRate:
          type:
          - number
          - 'null'
          description: 'The current charge rate in kW.


            This property is only available when the vehicle is charging, and is `null` any other time.'
          example: 2
        chargeTimeRemaining:
          type:
          - number
          - 'null'
          description: 'Estimated time until the current charging intent is completed, in minutes.


            This property is only available when the vehicle is charging, and is `null` any other time.'
          example: 285
        lastUpdated:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of last received charge state update
          example: '2020-04-07T17:04:26Z'
        maxCurrent:
          type:
          - number
          - 'null'
          deprecated: true
          description: 'Deprecated: Use `chargeRateLimit` instead.


            The maximum current that the vehicle can draw from the charger, in amps.'
          example: 16
        powerDeliveryState:
          $ref: '#/components/schemas/VehiclePowerDeliveryState'
        pluggedInChargerId:
          type:
          - string
          - 'null'
          description: "ID of the charger currently plugged into the vehicle. By default, this attribute will be `null` and will only be populated if:\n * The charger and the vehicle are linked to the same Enode `userId`.\n * AND Enode has determined that the vehicle and charger are **currently** plugged into each other."
          example: e7d4db80-4fca-4781-ac70-14108f560706
        chargeRateLimit:
          type:
          - number
          - 'null'
          description: 'The current charge rate limit in kW. Returns `null` when the vehicle is not plugged into a charger or when the value is unavailable from the vendor.


            Early Adopter: This property is only available for early adopters of [Set Charge Rate Limit](/api#postVehiclesVehicleidChargeRateLimit).'
      required:
